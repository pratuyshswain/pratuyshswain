<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contour Survey · Pratyusha Swain</title>
<style>
:root{color-scheme:light;--paper:#f7f4ec;--ink:#27352e;--rule:#b0b5a6;--rust:#863f27}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
main{max-width:1120px;margin:auto;padding:22px clamp(16px,4vw,52px) 40px}nav,footer,.tools,.choices{display:flex;gap:12px;align-items:center;flex-wrap:wrap}nav,footer{justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:14px}footer{border-block:1px solid var(--rule);padding:12px 0}
a{color:inherit}h1,h2{font:normal clamp(44px,7vw,78px)/1.05 Georgia,serif;margin:.45em 0 .2em;letter-spacing:-.045em}h2{font-size:32px;margin:0}header p{margin:0 0 24px}article{display:grid;grid-template-columns:2fr 1fr;border-top:1px solid var(--rule)}figure{margin:0;min-width:0}canvas{display:block;width:100%;aspect-ratio:1.4;touch-action:pan-y}aside{padding:24px 0 12px 24px;border-left:1px solid var(--rule)}button{font:inherit;color:inherit;background:transparent;border:1px solid #747e70;padding:7px 13px;border-radius:3px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#e2e5d8}button:focus-visible,a:focus-visible{outline:3px solid var(--rust);outline-offset:3px}button:disabled{opacity:.5;cursor:default}small,.mono{font:13px/1.6 ui-monospace,monospace}#result{color:var(--rust);min-height:3em}.tools{padding:0 0 18px}.choices button{min-width:44px}.mono{display:block}button[hidden]{display:none}@media(max-width:740px){article{grid-template-columns:1fr}aside{padding:16px 0;border-left:0;border-top:1px solid var(--rule)}}
</style>
<main><nav><a href="https://github.com/pratuyshswain">Pratyusha Swain</a><small>Terrain studies</small></nav>
<header><h1>Contour Survey</h1><p>Read a relief map. Find the highest survey station in three landscapes.</p></header>
<article><figure><canvas id="map" role="img" aria-label="Rotatable terrain with four lettered survey stations"></canvas>
<div class="tools"><button id="left" aria-label="Rotate left">↶ Left</button><button id="right" aria-label="Rotate right">Right ↷</button><button id="orbit" aria-pressed="false">Orbit</button></div></figure>
<aside><p class="mono" id="round"></p><h2>Which station is highest?</h2><p>Compare the four brass markers. Rotate the map or inspect the field readings below.</p>
<div class="choices" id="choices" aria-label="Choose a station"></div><p id="result" aria-live="polite"></p><button id="next" hidden></button>
<details><summary>Field readings</summary><p id="readings" class="mono"></p></details></aside></article>
<footer><small>Synthetic elevation · metres</small><a href="https://github.com/pratuyshswain/pratuyshswain/tree/main/docs">View source</a></footer></main>
<script>
'use strict';
const el=id=>document.getElementById(id);
const canvas=el('map'), ctx=canvas.getContext('2d');
const stations=[[-.49,-.46],[.45,-.42],[.44,.47],[-.45,.48]];
const letters='ABCD';
let angle=-.38,round=0,score=0,answered=false,orbit=false,frame=0,lastTime=0,order=[];
let points=[],cells=[],width,height;
function elevation(x,y){
  let z=.07+.04*Math.sin(4*x+2*y+round);
  stations.forEach(([u,v],i)=>{
    const a=order[i];
    z+=a*Math.exp(-((x-u)**2/(.15+.04*i)+(y-v)**2/.24));
  });
  return z;
}
function project(x,y,z){
  const u=x*Math.cos(angle)-y*Math.sin(angle), v=x*Math.sin(angle)+y*Math.cos(angle);
  return [width*(.5+.305*u),height*(.65+.185*v-.39*z),v];
}
function render(){
  const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  width=box.width;height=box.height;
  if(canvas.width!==Math.round(width*dpr)||canvas.height!==Math.round(height*dpr)){
    canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  const screen=points.map(p=>project(...p));
  const depth=c=>screen[c.ids[0]][2]+screen[c.ids[2]][2];
  cells.sort((a,b)=>depth(a)-depth(b));
  for(const {ids,shade} of cells){
    ctx.beginPath();ids.forEach((id,i)=>{const [x,y]=screen[id];i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();
    ctx.fillStyle=shade;ctx.fill();ctx.lineWidth=.55;ctx.strokeStyle='#596853';ctx.stroke();
  }
  stations.forEach(([x,y],i)=>{
    const [u,v]=project(x,y,elevation(x,y));
    ctx.strokeStyle='#684630';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(u,v);ctx.lineTo(u,v-16);ctx.stroke();
    ctx.fillStyle='#79462d';ctx.beginPath();ctx.arc(u,v-22,10,0,2*Math.PI);ctx.fill();
    ctx.font='bold 12px system-ui';ctx.fillStyle='white';ctx.textAlign='center';ctx.fillText(letters[i],u,v-18);
  });
}
function terrain(){
  points=[];cells=[];
  const n=30;
  for(let j=0;j<=n;j++)for(let i=0;i<=n;i++){
    const x=2*i/n-1,y=2*j/n-1;points.push([x,y,elevation(x,y)]);
    if(i&&j){
      const k=points.length-1,ids=[k-n-2,k-n-1,k,k-1];
      const z=points[k][2],light=Math.round(83-16*z+28*(z-points[k-1][2]));
      cells.push({ids,shade:'hsl(79 18% '+light+'%)'});
    }
  }
}
function survey(){
  answered=false;order=[.32,.49,.67,.95];
  for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  el('round').textContent='Survey '+(round+1)+' / 3  ·  Score '+score;
  el('result').textContent='';el('next').hidden=true;
  el('choices').replaceChildren();
  const heights=stations.map(([x,y])=>Math.round(1000*elevation(x,y)));
  const best=heights.indexOf(Math.max(...heights));
  el('readings').textContent=heights.map((h,i)=>letters[i]+' · '+h+' m').join(' / ');
  document.querySelector('details').open=false;
  [...letters].forEach((label,i)=>{
    const button=document.createElement('button');button.textContent=label;
    button.onclick=()=>{
      if(answered)return;answered=true;score+=Number(i===best);
      el('result').textContent=(i===best?'Correct. ':'Station '+label+' is at '+heights[i]+' m. ')+letters[best]+' is highest at '+heights[best]+' m.';
      el('round').textContent='Survey '+(round+1)+' / 3  ·  Score '+score;
      for(const b of el('choices').children)b.disabled=true;
      el('next').textContent=round===2?'Play again':'Next landscape';el('next').hidden=false;el('next').focus();
    };el('choices').append(button);
  });
  terrain();render();
}
el('next').onclick=()=>{round=(round+1)%3;if(!round)score=0;survey();el('choices').firstChild.focus()};
el('left').onclick=()=>{angle-=.27;render()};el('right').onclick=()=>{angle+=.27;render()};
function tick(t){angle+=Math.min(64,t-lastTime)*.00022;lastTime=t;render();frame=requestAnimationFrame(tick)}
el('orbit').onclick=()=>{orbit=!orbit;el('orbit').setAttribute('aria-pressed',String(orbit));el('orbit').textContent=orbit?'Pause orbit':'Orbit';if(orbit){lastTime=performance.now();frame=requestAnimationFrame(tick)}else cancelAnimationFrame(frame)};
let drag=null;
canvas.onpointerdown=e=>{drag=e.clientX;canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(drag!==null){angle+=(e.clientX-drag)*.009;drag=e.clientX;render()}};
canvas.onlostpointercapture=()=>{drag=null};
survey();new ResizeObserver(render).observe(canvas);
</script></html>
