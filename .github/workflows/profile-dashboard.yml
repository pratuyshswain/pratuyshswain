name: Refresh profile dashboard
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install GIF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y python3-pil fonts-dejavu-core
      - name: Render public data panels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 scripts/profile.py
      - name: Publish changed panels
        run: |
          git add assets/dashboard/{activity,highlights,skyline,stats}.svg assets/dashboard/skyline.gif assets/dashboard/name-box.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile panels'
          git push
