" fill="#c2a1e2" font-family="monospace" font-weight="400" font-size="18">Python · scikit-learn</text><rect x="706" y="250" width="683" height="229" rx="15" fill="#121922" stroke="#303943"/><text x="729" y="292" fill="#e8c67c" font-family="monospace" font-weight="700" font-size="18">FORECASTING</text><text x="729" y="346" fill="#e6edf3" font-family="Arial,sans-serif" font-weight="700" font-size="32">Mini Sales Dashboard</text><text x="729" y="394" fill="#a9b4bf" font-family="Arial,sans-serif" font-weight="400" font-size="21">Track demand and risk from synthetic retail sales.</text><text x="729" y="444" fill="#e8c67c" font-family="monospace" font-weight="400" font-size="18">Python · SQLite · Matplotlib</text><circle class="pulse" cx="650" cy="39" r="5" fill="#edaa88"/><circle class="pulse" cx="1353" cy="39" r="5" fill="#88c8b4"/><circle class="pulse" cx="650" cy="286" r="5" fill="#c2a1e2"/><circle class="pulse" cx="1353" cy="286" r="5" fill="#e8c67c"/></svg>