<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" role="img"><title>PS profile identifier</title><rect x="1" y="1" width="218" height="98" rx="15" fill="#0d1117" stroke="#30363d"/><circle cx="110" cy="50" r="40" fill="#191d24" stroke="#cb444a" stroke-width="2"/><circle cx="110" cy="50" r="32" fill="none" stroke="#55323a"/><text x="88" y="61" font-family="monospace" font-size="36" fill="#f0e8e5" font-weight="700">PS</text><style>@keyframes halo{0%,100%{opacity:.25;transform:scale(.89)}50%{opacity:.95;transform:scale(1.17)}}.move{transform-origin:110px 50px;animation:halo 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.move,.move *{animation:none!important}}</style><circle class="move" cx="110" cy="50" r="40" fill="none" stroke="#de7a73" stroke-width="3"/></svg>